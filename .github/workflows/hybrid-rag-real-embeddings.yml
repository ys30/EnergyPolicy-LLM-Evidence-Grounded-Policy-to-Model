name: hybrid-rag-real-embeddings
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_official_hybrid_rag.py'
      - 'src/energy_policy_llm/hybrid_retrieval.py'
      - '.github/workflows/hybrid-rag-real-embeddings.yml'
permissions:
  contents: read
jobs:
  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and real semantic encoder
        run: |
          python -m pip install -e .
          # CPU-only PyTorch avoids multi-GB CUDA wheels on the hosted runner.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'sentence-transformers>=3.4,<6' 'huggingface_hub>=0.28,<2'
      - name: Capture and verify official statutes
        run: python scripts/capture_corpus_ci.py
      - name: Audit frozen-source legal chunks
        run: python scripts/audit_official_rag.py
      - name: Execute real embedding and fusion ranking diagnostics
        run: python scripts/run_official_hybrid_rag.py
      - name: Archive unreviewed diagnostics, source metadata, and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NM-official-hybrid-rag-unreviewed
          path: |
            outputs/official_corpus/hybrid_rag_diagnostic.json
            outputs/official_corpus/rag_audit.json
            outputs/official_corpus/capture_manifest.json
          retention-days: 14
          if-no-files-found: error
