name: policy-schema-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/validate_evidence_registry.py
      - run: python scripts/create_annotation_queue.py
      - run: python scripts/check_real_rule_probes.py
      - run: python scripts/audit_source_anchors.py
      - run: python scripts/evaluate_fixture.py
      - run: python -m energy_policy_llm.sensitivity
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -v
