[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-policy-llm"
version = "0.1.0"
description = "Evidence-grounded energy policy to executable scenario research starter"
requires-python = ">=3.10"
dependencies = ["scipy>=1.10"]

[project.optional-dependencies]
test = []

[project.scripts]
energy-policy-demo = "energy_policy_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
